<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Luckiest Guy';src:url('fonts/LuckiestGuy.woff2') format('woff2');font-display:block}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#out{position:absolute;left:0;top:0}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<svg id="out" xmlns="http://www.w3.org/2000/svg"></svg>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
await document.fonts.load('40px "Luckiest Guy"');

const MODE = new URLSearchParams(location.search).get('mode') || 'thumb';
const W = MODE === 'icon' ? 512 : 1920, H = MODE === 'icon' ? 512 : 1080;
let seed = 5; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

const RAINBOW = ['#e8262b', '#ff6a1a', '#ffc21a', '#3cc43c', '#1a9be8', '#2a4fd8', '#8a3ce0', '#ff4fa8'];
const ALL = [...RAINBOW, '#18b5c9', '#1f1f28', '#f5f0e0'];
const rbox = (w, h, d, r) => new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001));
const glossy = (c) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.32, clearcoat: 0.7, clearcoatRoughness: 0.25 });
const pageMat = new THREE.MeshStandardMaterial({ color: '#fbf1d6', roughness: 0.7 });
const goldMat = new THREE.MeshStandardMaterial({ color: '#f5d26a', metalness: 0.5, roughness: 0.3 });
const matCache = {}; const bookMat = c => (matCache[c] ||= glossy(c));
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }

// A book lying flat: cover (rounded), pages sticking out on three sides, gold bands on the spine
function book(parent, w, h, d, color, x, y, z, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.set(rx, ry, rz); parent.add(g);
  const cover = new THREE.Mesh(rbox(w, h, d, 0.06), bookMat(color)); cover.castShadow = cover.receiveShadow = true; g.add(cover);
  const pages = new THREE.Mesh(new THREE.BoxGeometry(w * 0.93, h * 0.72, d * 0.96), pageMat); pages.position.x = w * 0.045; pages.castShadow = true; g.add(pages);
  for (const s of [-0.3, 0.3]) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.04, h * 1.01, d * 0.06), goldMat); b.position.set(-w / 2, 0, s * d); g.add(b); }
  return g;
}
function render(scene, camera, bloom = 0.35) {
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  if (bloom > 0) composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), bloom, 0.4, 0.9));
  composer.addPass(new OutputPass());
  composer.render();
  return renderer.domElement.toDataURL('image/png');
}

// ------------------------------------------------ messy pile (before)
function messyPile() {
  const scene = new THREE.Scene();
  const bg = canvasTex(16, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#ff3a1f'); gr.addColorStop(1, '#c80f2a'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  scene.background = bg;
  scene.add(new THREE.HemisphereLight('#fff4e0', '#ff6a50', 1.4));
  const sun = new THREE.DirectionalLight('#ffffff', 3.2); sun.position.set(-6, 14, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16 }); scene.add(sun);
  const pile = new THREE.Group(); scene.add(pile);
  // books thrown on a big heap; higher in the middle
  for (let i = 0; i < 340; i++) {
    const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 13;
    const x = Math.cos(a) * r * 1.25 - 6, z = Math.sin(a) * r * 0.8;
    const y = Math.max(0, 10 - r * 0.78) + rnd() * 0.9;
    const s = 0.9 + rnd() * 0.7;
    book(pile, 2.4 * s, 0.6 * s, 3.2 * s, ALL[Math.floor(rnd() * ALL.length)], x, y, z, (rnd() - 0.5) * 0.9, rnd() * Math.PI * 2, (rnd() - 0.5) * 0.9);
  }
  const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 200); cam.position.set(1, 13, 19); cam.lookAt(1, 4.8, 0);
  return render(scene, cam, 0.2);
}

// ------------------------------------------------ tidy rainbow aisle (after)
function tidyAisle() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#eef2f8'); scene.fog = new THREE.Fog('#eef2f8', 18, 55);
  scene.add(new THREE.HemisphereLight('#ffffff', '#d8dee8', 2.3));
  const sun = new THREE.DirectionalLight('#ffffff', 1.6); sun.position.set(4, 16, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -40, far: 80 }); scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 120), new THREE.MeshPhysicalMaterial({ color: '#f4f6fa', roughness: 0.15, clearcoat: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(40, 120), new THREE.MeshStandardMaterial({ color: '#f7f8fb' })); ceil.rotation.x = Math.PI / 2; ceil.position.y = 13; scene.add(ceil);
  const lamp = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 2.2, 2.2), toneMapped: false });
  for (let z = 6; z > -60; z -= 7) { const l = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.4), lamp); l.rotation.x = Math.PI / 2; l.position.set(0, 12.95, z); scene.add(l); }
  const metal = new THREE.MeshStandardMaterial({ color: '#f0f2f6', metalness: 0.35, roughness: 0.35 });
  // book instances (standing, spine to the aisle), sorted in rainbow order
  const bookGeo = rbox(1, 1, 1, 0.05);
  const count = 4000; const inst = new THREE.InstancedMesh(bookGeo, new THREE.MeshPhysicalMaterial({ roughness: 0.3, clearcoat: 0.6 }), count);
  inst.castShadow = true; let n = 0; const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color();
  const bandInst = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), goldMat, count); let nb = 0;
  for (const side of [-1, 1]) {
    const x = side * 5.2;
    for (let c = 0; c < 9; c++) {
      const z0 = 4 - c * 6.4;
      // frame
      const back = new THREE.Mesh(new THREE.BoxGeometry(0.2, 11, 6.2), metal); back.position.set(x + side * 0.8, 5.5, z0 - 3.1); scene.add(back);
      for (const zz of [z0, z0 - 6.2]) { const post = new THREE.Mesh(new THREE.BoxGeometry(1.8, 11, 0.25), metal); post.position.set(x, 5.5, zz); post.castShadow = true; scene.add(post); }
      for (let r = 0; r < 6; r++) {
        const sy = 0.3 + r * 1.8;
        const shelf = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.14, 6.2), metal); shelf.position.set(x, sy, z0 - 3.1); shelf.receiveShadow = true; scene.add(shelf);
        let z = z0 - 0.25; let k = 0;
        while (z > z0 - 6.0 && n < count) {
          const bw = 0.26 + rnd() * 0.12, bh = 1.15 + rnd() * 0.4;
          const ci = Math.min(RAINBOW.length - 1, Math.floor((k / 20) * RAINBOW.length));
          col.set(RAINBOW[ci]).offsetHSL(0, 0, (rnd() - 0.5) * 0.08);
          m4.compose(new THREE.Vector3(x - side * 0.1, sy + 0.07 + bh / 2, z - bw / 2), q, new THREE.Vector3(1.3, bh, bw));
          inst.setMatrixAt(n, m4); inst.setColorAt(n, col); n++;
          if (nb < count) { m4.compose(new THREE.Vector3(x - side * 0.76, sy + 0.07 + bh * 0.78, z - bw / 2), q, new THREE.Vector3(0.02, 0.08, bw * 1.01)); bandInst.setMatrixAt(nb++, m4); }
          z -= bw + 0.015; k++;
        }
      }
    }
  }
  inst.count = n; bandInst.count = nb; scene.add(inst, bandInst);
  const cam = new THREE.PerspectiveCamera(50, W / H, 0.1, 200); cam.position.set(-0.6, 5.6, 11); cam.lookAt(0.6, 4.6, -20);
  return render(scene, cam, 0.45);
}

// ------------------------------------------------ Roblox avatar for the icon
function faceTex() {
  return canvasTex(512, 512, (g) => {
    g.lineCap = 'round';
    // eyebrows (raised, worried)
    g.strokeStyle = '#3a1d0f'; g.lineWidth = 22;
    g.beginPath(); g.moveTo(120, 120); g.quadraticCurveTo(170, 80, 220, 112); g.stroke();
    g.beginPath(); g.moveTo(292, 112); g.quadraticCurveTo(342, 80, 392, 120); g.stroke();
    // big eyes
    for (const ex of [176, 336]) {
      g.fillStyle = '#fff'; g.beginPath(); g.ellipse(ex, 200, 52, 60, 0, 0, 7); g.fill();
      g.lineWidth = 8; g.strokeStyle = '#1a1a1a'; g.stroke();
      g.fillStyle = '#4a2a14'; g.beginPath(); g.ellipse(ex + 4, 212, 28, 32, 0, 0, 7); g.fill();
      g.fillStyle = '#111'; g.beginPath(); g.ellipse(ex + 4, 214, 15, 18, 0, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.ellipse(ex - 8, 198, 9, 11, 0, 0, 7); g.fill();
    }
    // screaming mouth
    g.fillStyle = '#2a0c0c'; g.beginPath(); g.moveTo(170, 320); g.quadraticCurveTo(256, 290, 342, 320); g.quadraticCurveTo(330, 450, 256, 455); g.quadraticCurveTo(182, 450, 170, 320); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(180, 322); g.quadraticCurveTo(256, 296, 332, 322); g.lineTo(326, 345); g.quadraticCurveTo(256, 324, 186, 345); g.fill();
    g.fillStyle = '#ff6a7a'; g.beginPath(); g.ellipse(256, 425, 46, 24, 0, 0, 7); g.fill();
    // sweat drop
    g.fillStyle = '#7fd4ff'; g.beginPath(); g.moveTo(430, 150); g.quadraticCurveTo(462, 210, 430, 222); g.quadraticCurveTo(398, 210, 430, 150); g.fill();
  });
}
function icon() {
  const scene = new THREE.Scene();
  // background: warm library wall full of books
  scene.background = new THREE.Color('#6a3a8a');
  scene.add(new THREE.HemisphereLight('#fff2e0', '#6a3a40', 1.3));
  const key = new THREE.DirectionalLight('#ffffff', 3.0); key.position.set(4, 8, 10); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); scene.add(key);
  const rim = new THREE.PointLight('#c48aff', 40, 30, 1.5); rim.position.set(-6, 6, -2); scene.add(rim);
  const wood = new THREE.MeshStandardMaterial({ color: '#9a5428', roughness: 0.6 });
  for (let r = 0; r < 7; r++) {
    const sy = -2 + r * 2.2;
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(30, 0.25, 1.6), wood); shelf.position.set(0, sy, -6); scene.add(shelf);
    let x = -14;
    while (x < 14) { const bw = 0.35 + rnd() * 0.25, bh = 1.4 + rnd() * 0.5; const b = new THREE.Mesh(rbox(bw, bh, 1.2, 0.04), bookMat(ALL[Math.floor(rnd() * ALL.length)])); b.position.set(x + bw / 2, sy + 0.12 + bh / 2, -6); b.rotation.z = rnd() < 0.1 ? 0.2 : 0; scene.add(b); x += bw + 0.03; }
  }
  const back = new THREE.Mesh(new THREE.PlaneGeometry(40, 30), wood); back.position.set(0, 6, -6.8); scene.add(back);
  // avatar
  const skin = new THREE.MeshStandardMaterial({ color: '#f6cfa8', roughness: 0.5 });
  const shirt = new THREE.MeshStandardMaterial({ color: '#2fbf71', roughness: 0.5 });
  const hairMat = new THREE.MeshStandardMaterial({ color: '#e0521f', roughness: 0.55 });
  const av = new THREE.Group(); av.position.set(1.0, -2.6, 4.0); av.rotation.y = 0.1; scene.add(av);
  const torso = new THREE.Mesh(rbox(3.0, 3.0, 1.5, 0.2), shirt); torso.position.y = 1.5; torso.castShadow = true; av.add(torso);
  const head = new THREE.Group(); head.position.y = 4.4; head.rotation.set(0.02, -0.05, 0.08); av.add(head);
  const hm = new THREE.Mesh(rbox(2.4, 2.3, 2.2, 0.55), skin); hm.castShadow = true; head.add(hm);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 2.1), new THREE.MeshStandardMaterial({ map: faceTex(), transparent: true, roughness: 0.5 })); face.position.z = 1.105; head.add(face);
  // blocky hair: cap, fringe pieces, side pieces and a ponytail
  const cap = new THREE.Mesh(rbox(2.6, 0.9, 2.4, 0.35), hairMat); cap.position.set(0, 1.15, -0.05); head.add(cap);
  const fringe = new THREE.Mesh(rbox(2.5, 0.55, 0.45, 0.2), hairMat); fringe.position.set(-0.05, 0.92, 0.95); fringe.rotation.z = -0.08; head.add(fringe);
  const swoop = new THREE.Mesh(rbox(1.0, 0.75, 0.42, 0.2), hairMat); swoop.position.set(-0.75, 0.62, 1.0); swoop.rotation.z = 0.35; head.add(swoop);
  for (const s of [-1, 1]) { const side = new THREE.Mesh(rbox(0.45, 1.8, 2.0, 0.2), hairMat); side.position.set(s * 1.25, 0.1, -0.15); head.add(side); }
  const tail = new THREE.Mesh(rbox(0.9, 1.6, 0.9, 0.35), hairMat); tail.position.set(0.3, 0.2, -1.4); tail.rotation.x = -0.5; head.add(tail);
  // arms raised, holding a tall wobbly stack of books
  for (const s of [-1, 1]) {
    const arm = new THREE.Group(); arm.position.set(s * 2.0, 2.6, 0.2); av.add(arm);
    const am = new THREE.Mesh(rbox(1.3, 2.8, 1.3, 0.25), skin); am.position.y = 1.1; am.castShadow = true; arm.add(am);
    arm.rotation.set(-0.35, 0, s * -0.35);
  }
  const stack = new THREE.Group(); stack.position.set(-2.7, 4.6, -0.6); stack.rotation.z = 0.38; av.add(stack);
  for (let i = 0; i < 12; i++) {
    const s = 0.62 - i * 0.008;
    book(stack, 3.4 * s, 0.4, 2.4 * s, RAINBOW[i % RAINBOW.length], (rnd() - 0.5) * 0.3 + i * 0.07, i * 0.41, 0, 0, (rnd() - 0.5) * 0.35, (rnd() - 0.5) * 0.08);
  }
  // a couple of books falling off the top
  book(scene, 1.7, 0.36, 1.25, '#ff4fa8', -2.8, 5.2, 5, 0.5, 0.8, 0.9);
  book(scene, 1.7, 0.36, 1.25, '#1a9be8', 3.6, 4.6, 4, -0.4, 0.2, -0.7);
  const cam = new THREE.PerspectiveCamera(42, 1, 0.1, 200); cam.position.set(0.4, 2.0, 13.2); cam.lookAt(0.5, 1.4, 4);
  return render(scene, cam, 0.25);
}

// ------------------------------------------------ compose the final image
const svg = document.getElementById('out'); svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
const star = (x, y, r, fill = '#fffbe6') => `<path d="M ${x} ${y - r} Q ${x + r * 0.16} ${y - r * 0.16} ${x + r} ${y} Q ${x + r * 0.16} ${y + r * 0.16} ${x} ${y + r} Q ${x - r * 0.16} ${y + r * 0.16} ${x - r} ${y} Q ${x - r * 0.16} ${y - r * 0.16} ${x} ${y - r} Z" fill="${fill}" filter="url(#glow)"/>`;
if (MODE === 'thumb') {
  const left = messyPile(), right = tidyAisle();
  const L = 'M 0 0 L 1060 0 L 900 1080 L 0 1080 Z', R = 'M 1060 0 L 1920 0 L 1920 1080 L 900 1080 Z';
  svg.innerHTML = `
  <defs>
    <clipPath id="cl"><path d="${L}"/></clipPath><clipPath id="cr"><path d="${R}"/></clipPath>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a3c"/><stop offset="0.5" stop-color="#ff1a1a"/><stop offset="1" stop-color="#c00012"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <image href="${left}" width="${W}" height="${H}" clip-path="url(#cl)"/>
  <image href="${right}" width="${W}" height="${H}" clip-path="url(#cr)"/>
  <line x1="1060" y1="-10" x2="900" y2="1090" stroke="#1a1a1a" stroke-width="30"/>
  <line x1="1060" y1="-10" x2="900" y2="1090" stroke="#ffffff" stroke-width="18"/>
  ${star(1290, 240, 46)}${star(1740, 380, 40)}${star(1520, 700, 34)}${star(1830, 820, 52)}${star(1180, 820, 30)}${star(1630, 150, 26)}
  <g filter="url(#ds)">
    <path id="ar" d="M 640 760 C 700 520, 900 430, 1150 470 L 1140 360 L 1400 560 L 1110 730 L 1125 615 C 950 590, 820 650, 760 790 Z"
      fill="url(#arrow)" stroke="#1a1a1a" stroke-width="34" stroke-linejoin="round" paint-order="stroke"/>
    <path d="M 640 760 C 700 520, 900 430, 1150 470 L 1140 360 L 1400 560 L 1110 730 L 1125 615 C 950 590, 820 650, 760 790 Z"
      fill="none" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
    <path d="M 690 700 C 760 540, 900 490, 1120 515" fill="none" stroke="#ff9a8a" stroke-width="16" stroke-linecap="round" opacity="0.7"/>
  </g>`;
} else {
  const img = icon();
  svg.innerHTML = `
  <defs>
    <linearGradient id="ban" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a3a"/><stop offset="1" stop-color="#b8001a"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <image href="${img}" width="512" height="512"/>
  ${star(452, 64, 22)}${star(70, 300, 16)}
  <rect x="-10" y="412" width="532" height="110" fill="#1a1a1a"/>
  <rect x="-10" y="420" width="532" height="100" fill="url(#ban)"/>
  <text x="256" y="494" font-family="Luckiest Guy" font-size="66" text-anchor="middle" fill="#ffffff" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round" paint-order="stroke">NEVER SLEEPS</text>`;
}
document.body.setAttribute('data-ready', '1');
</script>
</body></html>
