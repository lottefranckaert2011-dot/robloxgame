<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Luckiest Guy';src:url('fonts/LuckiestGuy.woff2') format('woff2');font-display:block}
@font-face{font-family:'Creepster';src:url('fonts/Creepster.woff2') format('woff2');font-display:block}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#wrap{position:relative}
canvas{display:block}
#overlay{position:absolute;left:0;top:0;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="wrap"><div id="gl"></div><svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

await Promise.all([document.fonts.load('40px "Luckiest Guy"'), document.fonts.load('40px Creepster')]);
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') || 'thumb';
const W = MODE === 'icon' ? 512 : 1920, H = MODE === 'icon' ? 512 : 1080;

let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
document.getElementById('gl').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a0f33');
scene.fog = new THREE.Fog('#1a0f33', 26, 60);

const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.0, ...opts });
const rbox = (w, h, d, r = 0.08) => new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001));
function mesh(geo, material, x = 0, y = 0, z = 0, parent = scene, shadows = true) {
  const m = new THREE.Mesh(geo, material); m.position.set(x, y, z);
  m.castShadow = shadows; m.receiveShadow = true; parent.add(m); return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

// ---------------------------------------------------------------- room
const WOOD = '#c4652c', DARKWOOD = '#7a3a1a', CASE = '#d98c4a', CASEBACK = '#b5682f';
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  for (let i = 0; i < 16; i++) {
    const shade = 150 + Math.floor(rnd() * 40);
    g.fillStyle = `rgb(${shade + 40},${shade * 0.5},${shade * 0.22})`; g.fillRect(0, i * 64, w, 62);
    g.fillStyle = 'rgba(60,20,5,0.6)'; g.fillRect(0, i * 64 + 62, w, 2);
    for (let k = 0; k < 3; k++) { const x = rnd() * w; g.fillRect(x, i * 64, 2, 64); }
  }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(4, 4);
const floor = mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.45 }), 0, 0, 0);
floor.rotation.x = -Math.PI / 2; floor.castShadow = false;

const wallMat = mat('#4a3a8a', { roughness: 0.9 });
mesh(new THREE.BoxGeometry(80, 30, 1), wallMat, 0, 15, -14, scene, false);
mesh(new THREE.BoxGeometry(1, 30, 60), wallMat, -22, 15, 0, scene, false);
mesh(new THREE.BoxGeometry(1, 30, 60), wallMat, 22, 15, 0, scene, false);
// wooden pillars + moulding on the back wall
for (let x = -20; x <= 20; x += 8) mesh(rbox(1.2, 30, 0.8), mat(CASE), x, 15, -13.4, scene, false);
mesh(rbox(80, 0.8, 1.2), mat('#a8442a'), 0, 13.5, -13.2, scene, false);

// big arched window with moon
const winX = MODE === 'icon' ? 3 : -1;
const winTex = canvasTex(512, 768, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#3a52c8'); gr.addColorStop(1, '#8a6ae0');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 60; i++) { g.fillStyle = `rgba(255,255,255,${0.3 + rnd() * 0.7})`; g.fillRect(rnd() * w, rnd() * h * 0.7, 2, 2); }
  const mx = w * 0.62, my = h * 0.28;
  const glow = g.createRadialGradient(mx, my, 10, mx, my, 160); glow.addColorStop(0, 'rgba(255,248,210,0.9)'); glow.addColorStop(1, 'rgba(255,248,210,0)');
  g.fillStyle = glow; g.fillRect(0, 0, w, h);
  g.fillStyle = '#fff6d8'; g.beginPath(); g.arc(mx, my, 70, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#3f55c9'; g.beginPath(); g.arc(mx + 30, my - 18, 62, 0, Math.PI * 2); g.fill();
});
const winGroup = new THREE.Group(); winGroup.position.set(winX, 0, -13.3); scene.add(winGroup);
const winShape = new THREE.Shape(); const ww = 6, wh = 11;
winShape.moveTo(-ww / 2, 0); winShape.lineTo(-ww / 2, wh - ww / 2); winShape.absarc(0, wh - ww / 2, ww / 2, Math.PI, 0, true); winShape.lineTo(ww / 2, 0); winShape.lineTo(-ww / 2, 0);
const winGeo = new THREE.ShapeGeometry(winShape, 32);
// remap UVs to 0..1
const pos = winGeo.attributes.position, uv = winGeo.attributes.uv;
for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + ww / 2) / ww, pos.getY(i) / wh);
const winMesh = new THREE.Mesh(winGeo, new THREE.MeshBasicMaterial({ map: winTex, toneMapped: false }));
winMesh.position.set(0, 3, 0.05); winGroup.add(winMesh);
const frameMat = mat('#e0b25a', { metalness: 0.3, roughness: 0.4 });
const frameShape = new THREE.Shape(); frameShape.moveTo(-ww / 2 - 0.5, -0.5); frameShape.lineTo(-ww / 2 - 0.5, wh - ww / 2); frameShape.absarc(0, wh - ww / 2, ww / 2 + 0.5, Math.PI, 0, true); frameShape.lineTo(ww / 2 + 0.5, -0.5);
frameShape.holes.push(winShape);
const frame = new THREE.Mesh(new THREE.ExtrudeGeometry(frameShape, { depth: 0.35, bevelEnabled: false }), frameMat); frame.position.set(0, 3, 0); winGroup.add(frame);
for (const x of [-1, 1]) { const bar = mesh(new THREE.BoxGeometry(0.18, wh, 0.2), frameMat, x, 3 + wh / 2, 0.15, winGroup, false); }
for (const y of [3, 6]) mesh(new THREE.BoxGeometry(ww, 0.18, 0.2), frameMat, 0, 3 + y, 0.15, winGroup, false);

// ---------------------------------------------------------------- books & cases
const bookColors = ['#e8453c', '#2f6fe0', '#38b05a', '#f2b632', '#9b4fe0', '#ff7ab6', '#ff8a2a', '#2ec4d6', '#8a5a32', '#f0e6c8', '#30303a'];
const pageMat = mat('#f6ecd0'), goldMat = mat('#f2cf6a', { metalness: 0.4, roughness: 0.35 });
function book(parent, w, h, d, color, x, y, z, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.set(rx, ry, rz); parent.add(g);
  mesh(rbox(w, h, d, 0.03), mat(color, { roughness: 0.5 }), 0, 0, 0, g);
  mesh(new THREE.BoxGeometry(w * 0.92, h * 0.7, d + 0.02), pageMat, w * 0.05, 0, 0, g);
  mesh(new THREE.BoxGeometry(w + 0.01, h + 0.01, d * 0.08), goldMat, 0, 0, -d * 0.3, g, false);
  mesh(new THREE.BoxGeometry(w + 0.01, h + 0.01, d * 0.08), goldMat, 0, 0, d * 0.3, g, false);
  return g;
}
function plaqueTex(text) {
  return canvasTex(256, 128, (g, w, h) => {
    g.fillStyle = '#2f7a62'; g.strokeStyle = '#f2c862'; g.lineWidth = 10;
    g.beginPath(); g.roundRect(8, 8, w - 16, h - 16, 50); g.fill(); g.stroke();
    g.fillStyle = '#fff3cf'; g.font = '72px "Luckiest Guy"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 6);
  });
}
function bookcase(x, z, ry, code, scale = 1) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; g.scale.setScalar(scale); scene.add(g);
  const W = 5, Hc = 8, D = 1.4;
  mesh(new THREE.BoxGeometry(W, Hc, 0.2), mat(CASEBACK), 0, Hc / 2, -D / 2, g);
  for (const sx of [-1, 1]) mesh(rbox(0.3, Hc, D, 0.05), mat(CASE), sx * (W / 2 - 0.15), Hc / 2, 0, g);
  mesh(rbox(W + 0.3, 0.4, D + 0.3, 0.08), mat('#e89a54'), 0, Hc + 0.2, 0, g);
  const arch = mesh(new THREE.CylinderGeometry(W / 2 - 0.2, W / 2 - 0.2, 0.3, 32, 1, false, -Math.PI / 2, Math.PI), mat(CASE), 0, Hc + 0.2, -D / 2 + 0.2, g);
  arch.rotation.x = Math.PI / 2;
  const pl = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.9), new THREE.MeshStandardMaterial({ map: plaqueTex(code), transparent: true, roughness: 0.5 }));
  pl.position.set(0, Hc + 1.2, -D / 2 + 0.4); g.add(pl);
  const rows = 4;
  for (let r = 0; r < rows; r++) {
    const sy = 0.3 + r * (Hc - 0.6) / rows;
    mesh(new THREE.BoxGeometry(W - 0.4, 0.15, D), mat(CASE), 0, sy, 0, g);
    let bx = -W / 2 + 0.4;
    while (bx < W / 2 - 0.6) {
      const bw = 0.18 + rnd() * 0.22, bh = 1.0 + rnd() * 0.55;
      if (rnd() < 0.15) { bx += bw + 0.05; continue; }
      const tilt = rnd() < 0.08 ? 0.25 : 0;
      book(g, bw, bh, 1.0, bookColors[Math.floor(rnd() * bookColors.length)], bx + bw / 2, sy + 0.08 + bh / 2, 0.05, 0, 0, tilt);
      bx += bw + 0.02;
    }
  }
  return g;
}

// ---------------------------------------------------------------- Roblox-style avatar
function faceTex(kind) {
  return canvasTex(256, 256, (g, w, h) => {
    g.clearRect(0, 0, w, h); g.fillStyle = '#111';
    if (kind === 'scared') {
      g.fillStyle = '#fff'; g.beginPath(); g.ellipse(88, 100, 30, 38, 0, 0, 7); g.ellipse(168, 100, 30, 38, 0, 0, 7); g.fill();
      g.fillStyle = '#111'; g.beginPath(); g.ellipse(92, 108, 15, 19, 0, 0, 7); g.ellipse(164, 108, 15, 19, 0, 0, 7); g.fill();
      g.lineWidth = 9; g.strokeStyle = '#111'; g.lineCap = 'round';
      g.beginPath(); g.moveTo(58, 52); g.lineTo(112, 64); g.moveTo(198, 52); g.lineTo(144, 64); g.stroke();
      g.beginPath(); g.ellipse(128, 182, 26, 30, 0, 0, 7); g.fill();
      g.fillStyle = '#7fd0ff'; g.beginPath(); g.moveTo(214, 40); g.quadraticCurveTo(232, 78, 214, 86); g.quadraticCurveTo(196, 78, 214, 40); g.fill();
    } else if (kind === 'happy') {
      g.beginPath(); g.ellipse(92, 100, 12, 22, 0, 0, 7); g.ellipse(164, 100, 12, 22, 0, 0, 7); g.fill();
      g.lineWidth = 12; g.strokeStyle = '#111'; g.lineCap = 'round'; g.beginPath(); g.arc(128, 140, 52, 0.2, Math.PI - 0.2); g.stroke();
    }
  });
}
function avatar(colors, face, pose = {}) {
  const root = new THREE.Group(); scene.add(root);
  const skin = mat(colors.skin), shirt = mat(colors.torso), pants = mat(colors.legs);
  const hip = new THREE.Group(); hip.position.y = 2; root.add(hip);
  // legs
  const legs = [];
  for (const s of [-1, 1]) {
    const piv = new THREE.Group(); piv.position.set(s * 0.5, 0, 0); hip.add(piv);
    mesh(rbox(0.98, 2, 1, 0.1), pants, 0, -1, 0, piv); legs.push(piv);
  }
  mesh(rbox(2, 2, 1, 0.12), shirt, 0, 1, 0, hip); // torso
  const arms = [];
  for (const s of [-1, 1]) {
    const piv = new THREE.Group(); piv.position.set(s * 1.5, 1.85, 0); hip.add(piv);
    mesh(rbox(1, 2, 1, 0.12), skin, 0, -0.85, 0, piv); arms.push(piv);
  }
  const headPiv = new THREE.Group(); headPiv.position.set(0, 2.6, 0); hip.add(headPiv);
  mesh(rbox(1.25, 1.2, 1.2, 0.3), skin, 0, 0, 0, headPiv);
  const f = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.1), new THREE.MeshStandardMaterial({ map: faceTex(face), transparent: true, roughness: 0.6 }));
  f.position.set(0, 0, 0.605); headPiv.add(f);
  legs[0].rotation.x = pose.legL || 0; legs[1].rotation.x = pose.legR || 0;
  arms[0].rotation.x = pose.armL || 0; arms[1].rotation.x = pose.armR || 0;
  arms[0].rotation.z = pose.armLz || 0; arms[1].rotation.z = pose.armRz || 0;
  headPiv.rotation.y = pose.head || 0; hip.rotation.x = pose.lean || 0;
  return { root, hip, arms, headPiv };
}
const NOOB = { skin: '#f5cd30', torso: '#1f6fd1', legs: '#4ba63a' };
const GIRL = { skin: '#f2c7a0', torso: '#ff5aa5', legs: '#3a3a8a' };

// ---------------------------------------------------------------- The Librarian
function librarian(x, z, ry, s = 1) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; g.scale.setScalar(s); scene.add(g);
  const robe = mat('#16101f', { roughness: 0.8 }), pale = mat('#dcd6ca', { roughness: 0.5 }), hair = mat('#5b5866');
  const body = mesh(new THREE.CylinderGeometry(1.1, 1.9, 6.4, 8), robe, 0, 3.2, 0, g);
  mesh(rbox(3.2, 1.2, 1.6, 0.3), robe, 0, 6.6, 0, g);
  const head = new THREE.Group(); head.position.set(0, 8.1, 0); g.add(head);
  mesh(rbox(1.7, 2.0, 1.6, 0.35), pale, 0, 0, 0, head);
  mesh(rbox(1.82, 0.75, 1.72, 0.3), hair, 0, 0.75, -0.05, head);
  const bun = mesh(new THREE.SphereGeometry(0.62, 24, 16), hair, 0, 1.25, -0.45, head);
  const eyeMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(4, 0.25, 0.3), toneMapped: false });
  const glassMat = mat('#18141e', { roughness: 0.3 });
  for (const sx of [-0.38, 0.38]) {
    const ring = mesh(new THREE.TorusGeometry(0.3, 0.07, 10, 28), glassMat, sx, 0.05, 0.82, head, false);
    const lens = mesh(new THREE.CircleGeometry(0.27, 24), mat('#08060c'), sx, 0.05, 0.81, head, false);
    const eye = mesh(new THREE.SphereGeometry(0.15, 16, 12), eyeMat, sx, 0.05, 0.84, head, false); eye.scale.set(1.3, 0.75, 0.4);
  }
  mesh(new THREE.BoxGeometry(0.5, 0.06, 0.05), mat('#3a1018'), 0, -0.55, 0.82, head, false);
  const red = new THREE.PointLight('#ff2030', 9, 16, 1.4); red.position.set(0, 6.8, 4.5); g.add(red);
  // arm raised: finger on the lips
  const armR = new THREE.Group(); armR.position.set(1.45, 6.8, 0); g.add(armR);
  mesh(rbox(0.55, 2.6, 0.55, 0.15), robe, 0, -1.2, 0, armR); armR.rotation.z = 0.15;
  const fore = new THREE.Group(); fore.position.set(0, -2.4, 0); armR.add(fore); fore.rotation.z = 2.55;
  mesh(rbox(0.5, 2.0, 0.5, 0.15), robe, 0, -0.9, 0, fore);
  mesh(rbox(0.5, 0.55, 0.45, 0.15), pale, 0, -2.0, 0.05, fore);
  mesh(rbox(0.16, 0.75, 0.16, 0.07), pale, 0.05, -2.55, 0.35, fore).rotation.x = -0.4;
  // arm reaching forward with long fingers
  const armL = new THREE.Group(); armL.position.set(-1.45, 6.8, 0); g.add(armL);
  armL.rotation.set(-1.1, 0, -0.35);
  mesh(rbox(0.55, 4.4, 0.55, 0.15), robe, 0, -2.1, 0, armL);
  mesh(rbox(0.55, 0.6, 0.45, 0.15), pale, 0, -4.5, 0, armL);
  for (let i = 0; i < 4; i++) { const fg = mesh(rbox(0.11, 0.9, 0.11, 0.05), pale, -0.2 + i * 0.13, -5.1, 0, armL); fg.rotation.x = 0.25; }
  return g;
}

// ---------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight('#8f7dff', '#5a2a14', 0.9));
scene.add(new THREE.AmbientLight('#ffffff', 0.25));
const moon = new THREE.DirectionalLight('#b8c4ff', 2.2); moon.position.set(winX + 4, 18, -10); moon.target.position.set(0, 0, 4);
moon.castShadow = true; moon.shadow.mapSize.set(2048, 2048); Object.assign(moon.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 }); scene.add(moon, moon.target);
const key = new THREE.SpotLight('#ffe2bd', 120, 50, 0.6, 0.6, 1.4); key.position.set(-8, 14, 14); key.target.position.set(-2, 2, 2);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); scene.add(key, key.target);
const rim = new THREE.PointLight('#8a5cff', 60, 30, 1.5); rim.position.set(-10, 6, -6); scene.add(rim);

// ---------------------------------------------------------------- layout
let camera;
if (MODE === 'thumb') {
  bookcase(-15.5, -6, 0.55, '1H', 1.15); bookcase(-11, -11.5, 0.2, '1G'); bookcase(-5.5, -12.6, 0, '2A');
  bookcase(15.5, -6, -0.55, '2P', 1.15); bookcase(12.5, -11.5, -0.2, '1D');
  // floor piles
  for (let i = 0; i < 26; i++) {
    const x = -14 + rnd() * 28, z = -6 + rnd() * 14, n = 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) book(scene, 1.1 + rnd() * 0.4, 0.28, 1.5, bookColors[Math.floor(rnd() * bookColors.length)], x + (rnd() - 0.5) * 0.4, 0.15 + k * 0.3, z, 0, rnd() * 6, 0);
  }
  // running noob with books
  const kid = avatar(NOOB, 'scared', { legL: 0.8, legR: -0.7, armL: -1.25, armR: -1.25, armLz: -0.15, armRz: 0.15, head: 0.3, lean: 0.12 });
  kid.root.position.set(-4.6, 0, 4.2); kid.root.rotation.y = -0.45;
  for (let i = 0; i < 4; i++) book(kid.hip, 1.6 - i * 0.05, 0.32, 1.9, bookColors[(i * 4 + 2) % bookColors.length], (i % 2 ? 0.05 : -0.05), 0.45 + i * 0.34, 1.35, 0, (rnd() - 0.5) * 0.4, 0);
  // second avatar hiding, peeking
  const kid2 = avatar(GIRL, 'scared', { armL: -0.4, armR: -1.6, legL: 0.1, legR: -0.1, head: 0.7 });
  kid2.root.position.set(-10.6, 0, -1.6); kid2.root.rotation.y = 0.7;
  librarian(6.8, -1.6, -0.45, 0.95);
  // flying books
  const fly = [[-0.5, 5.2, 4, 0.4], [1.8, 7.0, 1, -0.5], [-9.0, 7.8, -2, 0.3], [13.0, 6.5, -3, -0.6]];
  for (const [x, y, z, r] of fly) { book(scene, 1.4, 0.36, 1.9, bookColors[Math.floor(rnd() * bookColors.length)], x, y, z, r, r * 2, r); const l = new THREE.PointLight('#ffe08a', 4, 4); l.position.set(x, y, z); scene.add(l); }
  camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 200); camera.position.set(-0.5, 7.8, 20.5); camera.lookAt(0.8, 6.4, 0);
} else {
  bookcase(-7.5, -4, 0.35, '1H'); bookcase(7.8, -4.5, -0.4, '2P');
  librarian(2.4, -3.2, -0.25, 1.05);
  const kid = avatar(NOOB, 'scared', { armL: -1.3, armR: -1.3, head: 0.35 });
  kid.root.position.set(-2.4, 0, 5.2); kid.root.rotation.y = 0.2;
  for (let i = 0; i < 4; i++) book(kid.hip, 1.6 - i * 0.05, 0.32, 1.9, bookColors[(i * 3 + 1) % bookColors.length], 0, 1.0 + i * 0.34, 1.35, 0, (rnd() - 0.5) * 0.4, 0);
  const fly = [[5.6, 9.6, 1, -0.6], [-6.0, 6.8, 1, 0.3]];
  for (const [x, y, z, r] of fly) book(scene, 1.4, 0.36, 1.9, bookColors[Math.floor(rnd() * bookColors.length)], x, y, z, r, r * 2, r);
  camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200); camera.position.set(-0.4, 7.0, 15.5); camera.lookAt(0.2, 6.0, 0);
}

// ---------------------------------------------------------------- render with bloom
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.55, 0.45, 0.93));
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- big Roblox-style text
const svg = document.getElementById('overlay'); svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.innerHTML = `
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7b0"/><stop offset="0.45" stop-color="#ffd23a"/><stop offset="1" stop-color="#ff8a00"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a8a"/><stop offset="0.45" stop-color="#ff3b3b"/><stop offset="1" stop-color="#b3001e"/></linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe3ff"/></linearGradient>
  <filter id="ds" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/></filter>
</defs>`;
function chunky(text, x, y, size, fill, rot = 0, anchor = 'start', font = 'Luckiest Guy') {
  const t = `transform="rotate(${rot} ${x} ${y})"`;
  let s = '';
  for (let d = 9; d >= 1; d -= 2) s += `<text x="${x}" y="${y + d * size / 70}" font-family="${font}" font-size="${size}" text-anchor="${anchor}" fill="#140a26" stroke="#140a26" stroke-width="${size * 0.16}" stroke-linejoin="round" ${t}>${text}</text>`;
  s += `<text x="${x}" y="${y}" font-family="${font}" font-size="${size}" text-anchor="${anchor}" fill="url(#${fill})" stroke="#140a26" stroke-width="${size * 0.13}" stroke-linejoin="round" paint-order="stroke" ${t} filter="url(#ds)">${text}</text>`;
  s += `<text x="${x}" y="${y - size * 0.03}" font-family="${font}" font-size="${size}" text-anchor="${anchor}" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="${size * 0.025}" ${t}>${text}</text>`;
  return s;
}
if (MODE === 'thumb') {
  svg.innerHTML += chunky('THE LIBRARY', 820, 160, 140, 'white', -3, 'middle');
  svg.innerHTML += chunky('NEVER SLEEPS', 820, 310, 165, 'gold', -3, 'middle');
  svg.innerHTML += `<g transform="rotate(8 1620 270)">${chunky('SHHH!', 1620, 270, 120, 'red', 0, 'middle', 'Creepster')}</g>`;
  svg.innerHTML += `<g transform="translate(70 930) rotate(-4)"><rect x="0" y="0" width="420" height="96" rx="24" fill="#ff2f6a" stroke="#140a26" stroke-width="8"/>
    <text x="210" y="66" font-family="Luckiest Guy" font-size="54" text-anchor="middle" fill="#fff" stroke="#140a26" stroke-width="8" paint-order="stroke">👥 CO-OP!</text></g>`;
} else {
  svg.innerHTML += `<g transform="rotate(-10 120 92)">${chunky('SHHH!', 120, 92, 74, 'red', 0, 'middle', 'Creepster')}</g>`;
}

composer.render();
document.body.setAttribute('data-ready', '1');
</script>
